name: CI — Test Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Backend Unit Tests
  # ─────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-${{ github.run_id }}
          NODE_ENV: test
        run: npm test

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Frontend Unit Tests
  # ─────────────────────────────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Integration / E2E Tests
  # ─────────────────────────────────────────────────────────────────
  integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cims
          POSTGRES_PASSWORD: cims_test
          POSTGRES_DB: cims_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Seed test database
        env:
          DATABASE_URL: postgres://cims:cims_test@localhost:5432/cims_test
        run: node tests/fixtures/seed.js

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgres://cims:cims_test@localhost:5432/cims_test
          JWT_SECRET: ci-integration-secret-${{ github.run_id }}
          JWT_EXPIRES_IN: 1h
          PORT: 3000
          NODE_ENV: test
        run: |
          npm start &
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test --config tests/playwright.config.js --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Security Tests
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [backend-unit]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run security-specific tests
        working-directory: backend
        env:
          JWT_SECRET: ci-security-secret-${{ github.run_id }}
          NODE_ENV: test
        run: node --test tests/security.test.js

      - name: Audit npm dependencies for known vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts && npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────
  # Summary badge job
  # ─────────────────────────────────────────────────────────────────
  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit, integration, security]
    if: always()
    permissions: {}
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-unit.result }}" != "success" ||
                "${{ needs.frontend-unit.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required test jobs failed."
            exit 1
          fi
          echo "All required test jobs passed."
